aid: curity

name: Curity

image: https://curity.io/images/open-graph/homepage-sharing-image.jpg?v=20260618

description: Curity is a Stockholm-based identity company whose Curity Identity Server is a self-hosted OAuth 2.0
  and OpenID Connect server. Its interfaces are the standard OAuth/OIDC endpoints, a RESTCONF administration API,
  GraphQL user and client management APIs, and SCIM 2.0 user provisioning, all served by each customer deployment
  rather than a Curity-hosted base URL.

